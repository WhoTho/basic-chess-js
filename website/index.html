<!DOCTYPE html>
<html>
    <head>
        <title>Chess Game</title>
        <link rel="stylesheet" type="text/css" href="reset.css" />
        <link rel="stylesheet" type="text/css" href="layout.css" />
        <link rel="stylesheet" type="text/css" href="board.css" />
    </head>
    <body>
        <div class="container">
            <div class="options">
                <button id="startBtn">Start Game</button>
                <button id="resetBtn">Reset Game</button>

                <button id="undoBtn">Undo Move</button>
                <button id="copyFenBtn">Copy FEN</button>
                <button id="pasteFenBtn">Paste FEN</button>
                <button id="testBtn">Test</button>
                <button id="customBtn">Custom</button>
                <div class="section" id="player-chooser">
                    <select name="White Player" id="white-player-chooser">
                    </select>
                    <select name="Black Player" id="black-player-chooser">
                    </select>

                    <button id="startMatchBtn">Start Match</button>
                </div>
            </div>
            <div class="board-container">
                <div id="board"></div>
                <div id="promotion-options">
                    <button id="queen-promotion"></button>
                    <button id="rook-promotion"></button>
                    <button id="bishop-promotion"></button>
                    <button id="knight-promotion"></button>
                </div>
            </div>
            <div class="info">
            </div>
        </div>
        
    </body>
    <script type="module" src="../index.js"></script>
</html>
</html>
